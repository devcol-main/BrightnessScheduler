name: Build & Release

on:
  push:
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases
  actions: read     # SignPath reads the build artifact / job details

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./build.ps1 -Version $ver

      - name: Upload unsigned build
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: BrightnessScheduler-unsigned
          path: dist/*.exe

      # ---- Code signing (SignPath Foundation) ----
      # Runs only for release tags and only once the SignPath project is configured
      # (repository variable SIGNPATH_ORGANIZATION_ID + secret SIGNPATH_API_TOKEN). See CODE_SIGNING.md.
      - name: Sign with SignPath
        id: sign
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'BrightnessScheduler' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}   # empty = project default
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $src = if (Test-Path signed) { 'signed' } else { 'dist' }
          Copy-Item "$src/*.exe" release/
          Get-ChildItem release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0,-50} {1,-12} {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject
          }
          (Get-FileHash release/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }) | Set-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: BrightnessScheduler
          path: release/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
